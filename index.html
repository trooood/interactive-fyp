<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Interactive FYP</title>
        <script src="dist/d3.v7.min.js"></script>
        <script src="dist/x3dom-full.js"></script>
        <link rel="stylesheet" href="https://x3dom.org/release/x3dom.css"/>
        <script src="dist/d3-x3d.js"></script>
        <script src="chart-init.js"></script>  <!-- init chart with correct ranges -->
    </head>

    <body>

        <div id="chartholder"></div>
        <!-- <input type="button" id="refresh" value="Refresh"/> -->
        <input type="button" id="mach" value="Mach number"/>
        <input type="button" id="temp" value="Temperature"/>
        

        <script>
            // Select chartholder
            var chartHolder = d3.select("#chartholder");

            // Declare the chart component
            var plasmaColors = d3.quantize(d3.interpolatePlasma, 8);  // create array
            var myChart = d3.x3d.chart.scatterPlot()
                .mappings({ x: 'x', y: 'y', z: 'z', color: 'color', size: 'size' })
                .colors(plasmaColors)
                .sizeRange([0.1, 0.5]);

            var dataCache = null;  // for data cache
            
            initialize();

            // load data into cache
            function loadChartData() {
                if (dataCache) {
                    return Promise.resolve(dataCache);
                }
                
                return d3.csv("data/3_sample1000.csv").then(data => {
                    console.log("Total rows:", data.length);
                    dataCache = data;
                    return data;
                });
            }

            // map csv data to chart structure
            function mapData(data, colorColumn) {
                return {
                    values: data.map(d => ({
                        key: "Bubbles",
                        values: [
                            { key: "x", value: +d.x },
                            { key: "y", value: +d.y },
                            { key: "z", value: +d.z },
                            { key: "color", value: +d[colorColumn] },
                            { key: "size", value: 0.1 }
                        ]
                    }))
                };
            }

            // call chart
            function renderChart(colorColumn) {
                loadChartData().then(data => {
                    var chartData = mapData(data, colorColumn);
                    chartHolder.datum(chartData).call(myChart);
                });
            }



            // Hook a button to refresh chart
            //d3.select("#refresh").attr("onclick", "refreshChart()");
            // Button click handlers
            document.getElementById('mach').addEventListener('click', () => renderChart('Mach_mag'));
            document.getElementById('temp').addEventListener('click', () => renderChart('T'));
            


            // Initial render
            renderChart('Mach_mag');  // default



        </script>


        <br/>
        <div style="clear: both">Created with <a href="https://github.com/jamesleesaunders/d3-x3d">d3-x3d</a> D3 X3D Data
        Visualization Library.
        </div>


    </body>





</html>
