<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Interactive FYP</title>
        <script src="dist/d3.v7.min.js"></script>
        <script src="dist/x3dom-full.js"></script>
        <link rel="stylesheet" href="https://x3dom.org/release/x3dom.css"/>
        <script src="dist/d3-x3d.js"></script>
        <script src="chart-init.js"></script>  <!-- init chart with correct ranges -->
    </head>

    <body>

        <div id="chartholder"></div>
        <!-- <input type="button" id="refresh" value="Refresh"/> -->

        Time:
        <input type="range" min="0" max="5" step="1" value="0" id="timestep" list="timesteps" style="width: 200px">
        <datalist id="timesteps">
        <option value="0" label="0"></option>
        <option value="1" label="0.00005"></option>
        <option value="2" label="0.0001"></option>
        <option value="3" label="0.00015"></option>
        <option value="4" label="0.0002"></option>
        <option value="5" label="0.00025"></option>
        </datalist>
        t = <span id="timestep-value">0</span> seconds
        <!-- <span id="loading-text"></span> -->

        <br/>

        Data columns:
        <input type="button" id="data_mach" value="Mach Number"/>
        <input type="button" id="data_velocity" value="Velocity"/>
        <input type="button" id="data_temp" value="Temperature"/>
        <input type="button" id="data_h2" value="Hydrogen Concentration"/>
        <input type="button" id="data_pressure" value="Pressure"/>
        <input type="button" id="data_rho" value="Density"/>

        <div id="data-minmax"></div>

        <br/>

        Colour scheme:
        <input type="button" id="colour_turbo" value="Turbo"/>
        <input type="button" id="colour_plasma" value="Plasma"/>
        <input type="button" id="colour_greys" value="Greys"/>
        <input type="button" id="colour_spectral" value="Spectral"/>
        <input type="button" id="colour_sinebow" value="Sinebow"/>

        <div id="colourscheme-name"></div>
        <div id="color-bar-container">
            <table id="color-bar-table" style="width: 600px; height: 20px; border-collapse: collapse; table-layout: fixed;">
                <tbody>
                    <tr id="color-bar-row"></tr>
                </tbody>
            </table>
        </div>

        <br/><br/>
        Zoom in/out: scroll up/down<br/>
        Rotate: click + drag<br/>
        Pan: middle click + drag<br/>

        <script>
            // Select chartholder
            var chartHolder = d3.select("#chartholder");

            // load colour arrays
            var turboColors = d3.quantize(d3.interpolateTurbo, 8);  // create array from continuous scheme
            var plasmaColors = d3.quantize(d3.interpolatePlasma, 8);
            var greysColors = d3.quantize(d3.interpolateGreys, 8);
            var spectralColors = d3.quantize(d3.interpolateSpectral, 8).reverse();  // reversed
            var sinebowColors = d3.quantize(d3.interpolateSinebow, 8).reverse();  // reversed

            // Declare the chart component
            var myChart = d3.x3d.chart.scatterPlot()
                .width(700)
                .height(700)
                .mappings({ x: 'x', y: 'y', z: 'z', color: 'color', size: 'size' })
                .colors(turboColors)  // default colur scheme
                .sizeRange([0.1, 1.0]);

            //var dataCache = null;  // init data cache
            var currentDataColumn = 'Mach_mag';  // default column
            var currentSliderIndex = 0; // default time
            const dataCache = {};

            // for timestep slider
            const timestepMap = [0, 0.00005, 0.0001, 0.00015, 0.0002, 0.00025];  // map timesteps. not sure if this is needed
            const slider = document.getElementById('timestep');
            const display = document.getElementById('timestep-value');

            // for getting the values from the buttons
            const columnNames = {
                'Mach_mag': 'Mach Number',
                'U_mag': 'Velocity',
                'T': 'Temperature',
                'H2': 'Hydrogen concentration',
                'p': 'Pressure',
                'rho': 'Density'
            };

            // for getting the names of the colour scheme
            const colourSchemeNames = {
                'turbo': 'Turbo',
                'plasma': 'Plasma',
                'greys': 'Greys',
                'spectral': 'Spectral',
                'sinebow': 'Sinebow'
            };

            const colourArrays = {
                'turbo': turboColors,
                'plasma': plasmaColors,
                'greys': greysColors,
                'spectral': spectralColors,
                'sinebow': sinebowColors
            };

            function updateTimestep() {
                const index = parseInt(slider.value);
                currentSliderIndex = index;  // store current index
                const actualValue = timestepMap[index];
                display.textContent = actualValue;  // use this to show actual value instead of 0 (approx)
                console.log('Index:', index, 'Timestep:', actualValue);  // print index for linking to sample
                updateChartIndex(currentSliderIndex, currentDataColumn);
            }

            //slider.addEventListener('input', updateTimestep);
            //updateTimestep(); // Set initial value

            // load data into cache
            function loadData(index) {
                if (dataCache[index]) {  // if already cached
                    return Promise.resolve(dataCache[index]);
                }

                const filename = `data/${index}_sample1000.csv`;
                console.log(`Loading: ${filename}`);
                
                return d3.csv(filename).then(data => {
                    console.log(`Loaded index ${index}:`, data.length, "rows");
                    dataCache[index] = data;  // cache data when loaded
                    return data;
                });
            }

            // map csv data to chart structure
            function mapData(data, colorColumn) {

                const colorValues = data.map(d => +d[colorColumn]);  // gets the stats from the data
                const min = Math.min(...colorValues);
                const max = Math.max(...colorValues);

                const displayName = columnNames[colorColumn];
                const displayElement = document.getElementById('data-minmax');

                if (displayElement) {
                    displayElement.textContent = `Currently showing ${displayName}; min = ${min.toFixed(4)}, max = ${max.toFixed(4)}`;
                }
                
                return {  // mapped values
                    values: data.map(d => ({
                        //key: "data",
                        key: +d[colorColumn],
                        values: [
                            { key: "x", value: +d.x },
                            { key: "y", value: +d.y },
                            { key: "z", value: +d.z },
                            { key: "color", value: +d[colorColumn] },
                            { key: "size", value: 0.1 }
                        ]
                    }))
                };
            }

            function setColorScheme(scheme) {
                if (scheme === 'turbo') { myChart.colors(turboColors); }
                else if (scheme === 'plasma') { myChart.colors(plasmaColors) }
                else if (scheme === 'greys') { myChart.colors(greysColors) }
                else if (scheme === 'spectral') { myChart.colors(spectralColors) }
                else if (scheme === 'sinebow') { myChart.colors(sinebowColors) }

                const displayName = colourSchemeNames[scheme];
                const colourArray = colourArrays[scheme];
                if (colourArray) {
                    myChart.colors(colourArray);
                    
                    // update display element to show current scheme
                    const schemeDisplay = document.getElementById('colourscheme-name');
                    if (schemeDisplay) {
                        schemeDisplay.textContent = `Current scheme: ${displayName}`;
                    }
                    updateChartIndex(currentSliderIndex, currentDataColumn);
                    updateColorBar(colourArray);
                }

                // Re-render with current data column
                //updateChartIndex(currentSliderIndex, currentDataColumn);
            }

            // call chart
            function renderChart(colorColumn) {
                currentDataColumn = colorColumn;
                updateChartIndex(currentSliderIndex, colorColumn);

                /*
                loadData(0).then(data => {
                    var chartData = mapData(data, colorColumn);
                    chartHolder.datum(chartData).call(myChart);
                });
                */
            }

            function updateChartIndex(index, colorColumn) {
                loadData(index).then(data => {
                    var chartData = mapData(data, colorColumn);
                    chartHolder.datum(chartData).call(myChart);  // this calls the chart
                    console.log(`Updated chart to index ${index}`);
                });
            }

            function updateColorBar(colors) {
                const displayColors = colors.slice(0, 8);
                const row = document.getElementById('color-bar-row');
                row.innerHTML = '';
                
                for (let i = 0; i < 8; i++) {
                    const cell = document.createElement('td');
                    cell.style.backgroundColor = displayColors[i];
                    cell.style.width = '12.5%';
                    cell.style.height = '20px';
                    cell.style.margin = '0';
                    cell.style.padding = '0';
                    cell.style.border = 'none';
                    row.appendChild(cell);
                }
            }




            // Hook a button to refresh chart
            //d3.select("#refresh").attr("onclick", "refreshChart()");

            // buttons for data column
            document.getElementById('data_mach').addEventListener('click', () => renderChart('Mach_mag'));
            document.getElementById('data_velocity').addEventListener('click', () => renderChart('U_mag'));
            document.getElementById('data_temp').addEventListener('click', () => renderChart('T'));
            document.getElementById('data_h2').addEventListener('click', () => renderChart('H2'));
            document.getElementById('data_pressure').addEventListener('click', () => renderChart('p'));
            document.getElementById('data_rho').addEventListener('click', () => renderChart('rho'));

            // buttons for colour scheme
            document.getElementById('colour_turbo').addEventListener('click', () => setColorScheme('turbo'));
            document.getElementById('colour_plasma').addEventListener('click', () => setColorScheme('plasma'));
            document.getElementById('colour_greys').addEventListener('click', () => setColorScheme('greys'));
            document.getElementById('colour_spectral').addEventListener('click', () => setColorScheme('spectral'));
            document.getElementById('colour_sinebow').addEventListener('click', () => setColorScheme('sinebow'));

            slider.addEventListener('input', updateTimestep);
            window.addEventListener('load', function() {  // default load colour scheme
                if (typeof turboColors !== 'undefined') {
                    updateColorBar(turboColors);
                }
            });
            //updateTimestep(); // Set initial value
            //updateChartIndex(0, 'Mach_mag');
            //updateTimestep();

            /*
            slider.addEventListener('input', function() {
                const actualValue = timestepMap[this.value];  // if don't need actual value can remove
                console.log('Timestep:', actualValue);
            });
            */

            // Initial render
            initialize();
            renderChart('Mach_mag');  // default
            setColorScheme('turbo');



        </script>

        <br/><br/>
        
        <div style="clear: both">Created with <a href="https://github.com/jamesleesaunders/d3-x3d">d3-x3d</a> D3 X3D Data
        Visualization Library.
        </div>


    </body>





</html>
